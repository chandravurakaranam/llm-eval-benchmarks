name: Automated LLM Evaluation Engine

on:
  schedule:
    # Runs automatically every day at 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run-evals:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute LLM Benchmark Suite
        run: python eval_engine.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md llm_eval_history.csv llm_performance_matrix.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: LLM evaluation leaderboards & latency metrics" && git push)
